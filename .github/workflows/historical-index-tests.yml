name: 历史指数成分数据测试

on:
  pull_request:
    paths:
      - "src/collect_historical_index.py"
      - "tests/test_historical_index.py"
      - ".github/workflows/historical-index-tests.yml"
  workflow_dispatch:

jobs:
  validate-index:
    name: 不依赖网络的历史成分逻辑校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装必要依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas baostock pytest

      - name: 检查历史成分业务规则
        run: python -m pytest tests/test_historical_index.py -v
