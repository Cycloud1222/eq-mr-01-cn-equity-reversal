name: 量化研究代码测试

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: 无行情依赖单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装测试所需依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels baostock pytest

      - name: 运行测试（没有本地行情时数据测试会跳过）
        run: python -m pytest tests -q
